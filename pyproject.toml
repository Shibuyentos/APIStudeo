[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "apistudeo"
version = "0.1.0"
description = "Cliente Python não oficial para a API do Studeo, o ambiente EAD da Unicesumar."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kauann Shibuya" }]
keywords = ["studeo", "unicesumar", "ead", "sdk", "httpx", "pydantic"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Natural Language :: Portuguese (Brazilian)",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/Shibuyentos/APIStudeo"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
apistudeo = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
